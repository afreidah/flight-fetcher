# -------------------------------------------------------------------------------
# SonarCloud Project Configuration
#
# Project: Flight Fetcher / Author: Alex Freidah
#
# Read by the sonarqube-scan-action step in .github/workflows/ci.yml. Declares
# the SonarCloud project key and organisation, the coverage report paths so the
# unit and integration profiles are merged into one figure in the dashboard,
# and the generated directories the analyser must skip so auto-generated code
# does not raise duplication or complexity findings nobody can act on.
#
# This file only takes effect once Automatic Analysis is disabled in the
# SonarCloud project settings; the two modes are mutually exclusive.
# -------------------------------------------------------------------------------

sonar.projectKey=afreidah_flight-fetcher
sonar.organization=afreidah

# Coverage profiles produced by the test and integration-test jobs and
# downloaded as artifacts by the sonarqube job. internal/store is exercised
# only by the integration run, so both are needed for its coverage to appear.
sonar.go.coverage.reportPaths=unit.out,integration.out

# Source directories
sonar.sources=.
sonar.exclusions=**/*_test.go,internal/store/sqlc/**,internal/store/migrations/**,deploy/**,docs/**,**/*.sql

# Coverage exclusions (not counted toward the coverage metric).
#
# internal/store/sqlc is generated by sqlc and internal/store/migrations holds
# embedded SQL, neither of which has behaviour worth a test.
#
# internal/server/index.html is the whole dashboard, ~680 lines of markup with
# two inline <script> blocks, embedded into the binary by index.go. It is
# browser glue that needs a real DOM and fetch implementation to exercise
# meaningfully, and standing up a JS toolchain for it is disproportionate to
# the value, so it is excluded from the metric rather than left dragging it
# down.
sonar.coverage.exclusions=internal/store/sqlc/**,internal/store/migrations/**,internal/server/index.html

# This is a Go-only project. The .sql files under internal/store are PostgreSQL
# DDL/DML for sqlc code-gen, not Oracle PL/SQL. Pin the PL/SQL analyser to no
# file suffixes so it does not scan the schema and warn that the Oracle Data
# Dictionary is missing (rules S3641 / S3921 / S3618 / S3651).
sonar.plsql.file.suffixes=

# Test directories
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Encoding
sonar.sourceEncoding=UTF-8
